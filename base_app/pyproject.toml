[project]
name = "sellphi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "rq>=2.1",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 probes bcrypt.__about__, which bcrypt>=4.1 removed —
    # pin below that until passlib ships a fix.
    "bcrypt<4.1",
    "python-multipart>=0.0.12",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
